version: 2

sources:
  - name: payin
    description: >-
      Provider exports and the payment engine log for the June 2026 reconciliation.
      All inputs are read from staged/, populated by scripts/prepare_inputs.py: real files
      where a transform applies, symlinks to raw/ otherwise. Everything is read as varchar
      so every cast is explicit in staging.
    tables:
      - name: payment_engine_log
        description: Payment backend log extract, all providers. Internal source of truth.
        meta:
          external_location: >-
            read_csv('staged/payment_engine_log.csv',
              header = true, all_varchar = true)

      - name: paypal_us_activity
        description: PayPal US account activity export.
        meta:
          external_location: >-
            read_csv('staged/paypal_us_activity_20260601_20260703.csv',
              header = true, all_varchar = true)

      - name: paypal_eu_activity
        description: PayPal EU account activity export. Semicolon-delimited, comma decimals.
        meta:
          external_location: >-
            read_csv('staged/paypal_eu_activity_20260601_20260703.csv',
              delim = ';', header = true, all_varchar = true)

      - name: adyen_payment_accounting
        description: Adyen payment accounting report. Timestamps in Europe/Amsterdam.
        meta:
          external_location: >-
            read_csv('staged/adyen_payment_accounting_20260601_20260703.csv',
              header = true, all_varchar = true)

      - name: dlocal_transactions
        description: dLocal transactions export. Amounts in minor units.
        meta:
          external_location: >-
            read_csv('staged/dlocal_transactions_20260601_20260703.csv',
              header = true, all_varchar = true)

      - name: google_play_earnings_202606
        description: Google Play earnings, June. Line 1 is a report preamble.
        meta:
          external_location: >-
            read_csv('staged/google_play_earnings_202606.csv',
              skip = 1, header = true, all_varchar = true)

      - name: google_play_earnings_202607_partial
        description: Google Play earnings, July 1-3. Line 1 is a report preamble.
        meta:
          external_location: >-
            read_csv('staged/google_play_earnings_202607_partial.csv',
              skip = 1, header = true, all_varchar = true)

      - name: fx_rates
        description: Daily FX rates to USD. usd_rate is USD per 1 unit of currency.
        meta:
          external_location: >-
            read_csv('staged/fx_rates.csv',
              header = true, all_varchar = true)

      - name: fee_schedule
        description: Contracted provider fees, where a contract is on file.
        meta:
          external_location: >-
            read_csv('staged/fee_schedule.csv',
              header = true, all_varchar = true)
