name: payin_reconciliation
version: 1.0.0
config-version: 2
profile: payin_reconciliation

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  reporting_month: '2026-06-01'
  # Declared coverage of the provider exports, from their filenames. Used to resolve the
  # ambiguous date rows in the PayPal EU export - see stg__payment_log_paypal.
  export_window_start: '2026-06-01'
  export_window_end: '2026-07-03'

flags:
  send_anonymous_usage_stats: false

models:
  payin_reconciliation:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
